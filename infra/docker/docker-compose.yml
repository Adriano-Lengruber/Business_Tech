name: al-business-os

networks:
  al_net:
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: al_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-al_os_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-al_business_os}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-al_os_user} -d ${POSTGRES_DB:-al_business_os}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - al_net

  redis:
    image: redis:7-alpine
    container_name: al_os_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - al_net

  s3:
    image: rustfs/rustfs:latest
    container_name: al_os_s3
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-change_me_s3_secret}
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./volumes/s3:/data
    networks:
      - al_net

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: al_os_evolution
    profiles: ["whatsapp"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_URL: ${EVOLUTION_API_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change_me_evolution_api_key}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-al_os_user}:${POSTGRES_PASSWORD:-change_me_dev_password}@postgres:5432/${POSTGRES_DB:-al_business_os}?schema=evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      DEL_INSTANCE: "false"
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    volumes:
      - ./volumes/evolution:/evolution/instances
    networks:
      - al_net

  ollama:
    image: ollama/ollama:latest
    container_name: al_os_ollama
    profiles: ["ai-local"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama
    networks:
      - al_net

  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: al_os_whisper
    profiles: ["ai-local"]
    restart: unless-stopped
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-small}
    ports:
      - "${WHISPER_PORT:-8000}:8000"
    volumes:
      - ./volumes/whisper:/root/.cache/huggingface
    networks:
      - al_net
